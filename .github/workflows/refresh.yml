name: Refresh catalog

on:
  schedule:
    - cron: '0 5 * * *' # daily 05:00 UTC — the catalog stays current hands-free
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check links and source metadata
        id: refresh
        # dead links make the step fail AFTER writing the report — keep going
        # so successful checks and source metadata can still land
        continue-on-error: true
        env:
          # optional: unlock the Kaggle metadata adapter (Settings → Secrets)
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: npm run refresh

      - name: Validate refreshed catalog
        run: npm run validate

      - name: Unit tests
        run: npm test

      # Successful checks and source metadata can advance even when a different
      # link needs editorial review. Only catalog.json is committed.
      - name: Commit checked catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "catalog already current"
            exit 0
          fi
          git config user.name "atlas-refresh-bot"
          git config user.email "actions@github.com"
          git add data/catalog.json
          git commit -m "Automated daily catalog check"
          git push
          # Commits made with GITHUB_TOKEN do not trigger push workflows.
          gh workflow run deploy-pages.yml --ref main

      - name: Report dead links for editorial review
        if: steps.refresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const r=require("./refresh-report.json"); process.stdout.write("Dead links found on " + new Date().toISOString().slice(0,10) + ":\n\n" + r.dead.map(x=>"- " + x).join("\n") + "\n")' > dead-links.md
          issue=$(gh issue list --state open --search 'Catalog links need review in:title' --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file dead-links.md
          else
            gh issue create --title 'Catalog links need review' --body-file dead-links.md
          fi
          echo "::error::Dead links detected — see the catalog review issue"
          exit 1
