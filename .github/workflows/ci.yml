name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install test tooling
        run: npm ci

      # The app has no runtime packages; CI installs Playwright for smoke tests.
      - name: Syntax-check every module
        run: |
          for f in $(find js scripts tests e2e -name '*.js') playwright.config.js; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test

      - name: Validate catalog
        run: npm run validate

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
